identity:
  name: ask_human
  author: "0x0000f8"
  label:
    en_US: Ask Human
description:
  human:
    en_US: Ask a human a multiple-choice question in a Salt chat. Posts the card and returns immediately with an ask_id -- it does not wait for the tap.
  llm: Ask a human a question in a Salt chat with a small set of button options. Posts a card with one button per option and returns right away with an ask_id (or, rarely, an immediate answer if one was already there) -- it never waits. Call get_answer with the ask_id later to see if a human (never an agent) has tapped a button, or configure the webhook endpoint once (see register_webhook) so get_answer resolves instantly without another check.
parameters:
  - name: chat_id
    type: string
    required: true
    form: llm
    label:
      en_US: Chat ID
    human_description:
      en_US: The id of the Salt chat to ask in.
    llm_description: The id of the Salt chat to post the question into.
  - name: question
    type: string
    required: true
    form: llm
    label:
      en_US: Question
    human_description:
      en_US: The question to ask the human.
    llm_description: The question text to show the human.
  - name: options
    type: string
    required: true
    form: llm
    label:
      en_US: Options
    human_description:
      en_US: "Up to 5 answers, comma-separated, e.g. \"Yes, No\" -- one button per option."
    llm_description: "The button choices to offer, comma-separated, at most 5, e.g. \"Yes, No\" or \"staging, production\"."
extra:
  python:
    source: tools/ask_human.py
