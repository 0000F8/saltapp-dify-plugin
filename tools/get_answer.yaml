identity:
  name: get_answer
  author: "0x0000f8"
  label:
    en_US: Get Answer
description:
  human:
    en_US: Check on a question asked with Ask Human that had not been answered yet.
  llm: Check a pending ask_id from ask_human for an answer. If a webhook push already recorded the tap (see register_webhook), this resolves instantly with no Salt API call at all; otherwise it makes exactly one on-demand check. Returns an answered status with the answer if a human has tapped, a pending status to check again later, or an unknown status if this ask_id is not recognized.
parameters:
  - name: ask_id
    type: string
    required: true
    form: llm
    label:
      en_US: Ask ID
    human_description:
      en_US: The ask_id returned by a previous ask_human call that came back pending.
    llm_description: The ask_id from a prior ask_human call whose status was "pending".
extra:
  python:
    source: tools/get_answer.py
